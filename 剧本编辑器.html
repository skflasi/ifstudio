<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本编辑器</title>
<style>
:root {
  --bg: #0f1117;
  --bg2: #171a23;
  --bg3: #1e2230;
  --border: #2a3040;
  --text: #e6e9f0;
  --dim: #8b93a7;
  --accent: #6c8cff;
  --accent2: #9f7cff;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 10px;
  --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
}

/* screen-reader only */
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* (CSS omitted for brevity - unchanged from previous commit) */
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header id="topbar" role="banner">
  <div class="brand">📖 <b>IF Studio</b><span class="brand-sub">互动剧本工作台</span></div>
  <input id="projectNameInput" class="sr-only" aria-label="项目名输入">
  <div class="project-name" id="projectName" title="点击修改项目名" role="textbox" tabindex="0">未命名项目 ✏️</div>
  <div class="top-actions">
    <button id="btnSettings" class="btn ghost" title="AI 接口设置">⚙️ 设置</button>
    <span id="saveStatus" class="save-status" aria-live="polite">已保存</span>
    <button id="btnExport" class="btn ghost" title="导出项目为文件（全文/正文/设定本可选）">📤 导出</button>
    <button id="btnImport" class="btn ghost" title="从 .ifproj 文件导入项目">📥 导入</button>
    <button id="btnNewProject" class="btn ghost">新建项目</button>
    <button id="btnOpenProject" class="btn ghost">打开</button>
  </div>
  <input id="importFile" type="file" accept="application/json" class="sr-only" aria-hidden="true">
</header>

<div id="main" role="main">

  <!-- ============ 左侧栏：章节 ============ -->
  <aside id="sidebar" aria-label="章节面板">
    <div class="side-title">章节
      <button id="btnAddChapter" class="btn mini" title="添加章节">＋</button>
    </div>
    <div id="chapterList" class="chapter-list" tabindex="0" aria-label="章节列表"></div>
    <div class="side-title draft-title">📝 草稿
      <button id="btnAddDraft" class="btn mini" title="添加草稿">＋</button>
    </div>
    <div id="draftList" class="chapter-list draft-list" tabindex="0" aria-label="草稿列表"></div>
    <div class="side-footer">
      <details class="help-box">
        <summary>📐 剧本标记语法（速查）</summary>
        <pre>（略）</pre>
      </details>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <section id="content">
    <nav id="tabs" role="tablist" aria-label="主要面板">
      <button class="tab active" data-tab="editor" role="tab" aria-controls="page-editor" aria-selected="true" tabindex="0">✍️ 正文编辑</button>
      <button class="tab" data-tab="graph" role="tab" aria-controls="page-graph" aria-selected="false" tabindex="-1">🧭 分支图谱</button>
      <button class="tab" data-tab="stats" role="tab" aria-controls="page-stats" aria-selected="false" tabindex="-1">📊 数据统计</button>
      <button class="tab" data-tab="world" role="tab" aria-controls="page-world" aria-selected="false" tabindex="-1">📚 设定库</button>
      <button class="tab" data-tab="ai" role="tab" aria-controls="page-ai" aria-selected="false" tabindex="-1">🤖 AI 指令</button>
      <button class="tab" data-tab="rp" role="tab" aria-controls="page-rp" aria-selected="false" tabindex="-1">🎭 角色扮演</button>
      <button class="tab" data-tab="play" role="tab" aria-controls="page-play" aria-selected="false" tabindex="-1">▶️ 试玩</button>
    </nav>

    <!-- 正文编辑 -->
    <div class="tab-page active" id="page-editor" role="tabpanel" aria-labelledby="editor">
      <div class="editor-head">
        <button id="btnSidebarToggleEditor" class="btn ghost sm" title="切换章节">☰ 章节</button>
        <label for="chapterIdLabel" class="sr-only">章节编号</label>
        <input id="chapterIdLabel" class="chapter-id-label" title="章节编号（可修改，用于【跳转 编号】如【跳转 002】）" maxlength="40" spellcheck="false" aria-label="章节编号">
        <input id="chapterTitle" class="chapter-title-input" placeholder="章节标题" aria-label="章节标题">
        <span id="chapterWords" class="words-hint">0 字</span>
        <div class="editor-convert">
          <button id="btnToDraft" class="btn ghost sm" title="把当前章节转成草稿">⬇️ 转草稿</button>
          <button id="btnToChapter" class="btn ghost sm" title="把当前草稿转成正式章节">⬆️ 转章节</button>
        </div>
        <div class="view-switch" id="viewSwitch" role="tablist" aria-label="视图切换">
          <button class="view-btn active" data-view="text" aria-pressed="true">📝 纯文本</button>
          <button class="view-btn" data-view="bubble" aria-pressed="false">💬 气泡流</button>
        </div>
      </div>

      <textarea id="chapterContent" placeholder="在这里编写剧本正文……\n\n支持标记：\n-选项开始【选项一】选项文本-选项结束\n*路线标记 /场景说明（[...]）" spellcheck="true" aria-label="章节正文"></textarea>

      <!-- 气泡流编辑器（由文本编译而来） -->
      <div id="bubbleEditor" class="bubble-editor hidden" aria-label="气泡流编辑器" tabindex="0"></div>

      <div class="mark-toolbar" role="toolbar" aria-label="标记工具栏">
        <button class="mark-btn" data-ins="-选项开始\n">选项开始</button>
        <button class="mark-btn" data-ins="-选项结束\n">选项结束</button>
        <button class="mark-btn" data-ins="【角色名】\"台词\"\n">对话</button>
        <button class="mark-btn" data-ins="一行旁白\n">旁白</button>
        <button class="mark-btn" data-ins="*路线标记\n">路线</button>
        <button class="mark-btn" data-ins="【if 条件】\n">条件开始</button>
        <button class="mark-btn" data-ins="【endif】\n">条件结束</button>
        <button id="btnCompileBubble" class="mark-btn" title="从文本生成气泡流">编译为气泡</button>
        <button id="btnMergeText" class="mark-btn" title="把气泡流合并回纯文本">合并为文本</button>
      </div>

      <div class="editor-foot">
        <div class="hint">提示：双击章节列表可重命名，按 Ctrl+S 自动保存。</div>
        <div style="margin-left:auto; display:flex; gap:8px;">
          <button id="btnSave" class="btn primary">保存</button>
          <button id="btnPreview" class="btn">预览</button>
        </div>
      </div>
    </div>

    <!-- 占位：分支图谱 -->
    <div class="tab-page" id="page-graph" role="tabpanel" aria-hidden="true">
      <div class="graph-head"><h3 style="margin:0;color:var(--dim);">分支图谱（预览）</h3></div>
      <div class="graph-canvas" aria-label="分支图谱画布"> <!-- SVG 或 Canvas 在此渲染 --> </div>
    </div>

    <!-- 占位：统计 -->
    <div class="tab-page" id="page-stats" role="tabpanel" aria-hidden="true">
      <div class="stat-cards"><div class="stat-card"><div class="num">0</div><div class="lbl">章节数</div></div></div>
    </div>

    <!-- 占位：设定库 -->
    <div class="tab-page" id="page-world" role="tabpanel" aria-hidden="true">
      <div class="world-grid"><div class="panel">设定库</div></div>
    </div>

    <!-- 占位：AI -->
    <div class="tab-page" id="page-ai" role="tabpanel" aria-hidden="true">
      <div class="ai-layout"><div class="ai-input-panel panel">AI 控制面板</div><div class="ai-output-panel panel">输出</div></div>
    </div>

    <!-- 占位：角色扮演 -->
    <div class="tab-page" id="page-rp" role="tabpanel" aria-hidden="true">
      <div id="page-rp-inner" style="padding:18px;">角色扮演区域（可在此进行对话模拟）</div>
    </div>

    <!-- 占位：试玩 -->
    <div class="tab-page" id="page-play" role="tabpanel" aria-hidden="true">
      <div id="playStage" class="play-stage" data-fs="m" aria-label="试玩舞台">
        <div class="play-bg" data-bg="0"></div>
        <div class="play-dialog is-narrate" role="group" aria-label="对白框">
          <div class="play-name">Narrator</div>
          <div class="play-text">这是试玩对白示例。</div>
        </div>
      </div>
    </div>

  </section>

</div>

<script>
/* Project persistence, autosave, import/export, bubble compile
   - stores project in localStorage under key IFSTUDIO_PROJECT
   - simple chapters model with id/title/content/isDraft
   - bubble compiler: simple line-based parser -> bubble elements
*/
(function(){
  const STORAGE_KEY = 'IFSTUDIO_PROJECT_v1';
  const AUTO_SAVE_DEBOUNCE = 1200; // ms

  let project = null;
  let currentChapterId = null;
  let autosaveTimer = null;
  let isDirty = false;

  // DOM refs
  const projectNameEl = document.getElementById('projectName');
  const saveStatusEl = document.getElementById('saveStatus');
  const chapterListEl = document.getElementById('chapterList');
  const draftListEl = document.getElementById('draftList');
  const chapterIdInput = document.getElementById('chapterIdLabel');
  const chapterTitleInput = document.getElementById('chapterTitle');
  const chapterContentEl = document.getElementById('chapterContent');
  const bubbleEditorEl = document.getElementById('bubbleEditor');
  const btnSave = document.getElementById('btnSave');
  const btnAddChapter = document.getElementById('btnAddChapter');
  const btnAddDraft = document.getElementById('btnAddDraft');
  const btnImport = document.getElementById('btnImport');
  const btnExport = document.getElementById('btnExport');
  const importFileInput = document.getElementById('importFile');
  const btnCompileBubble = document.getElementById('btnCompileBubble');
  const btnMergeText = document.getElementById('btnMergeText');

  // utilities
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function nowISO(){ return new Date().toISOString(); }

  function defaultProject(){
    return {
      id: uid(),
      name: '未命名项目',
      createdAt: nowISO(),
      updatedAt: nowISO(),
      chapters: [ { id: '001', title: '示例章节', content: '这是示例正文。', isDraft: false } ],
      settings: {},
      vars: {}
    };
  }

  // render
  function renderProject(){
    projectNameEl.textContent = project.name;
    renderChapterList();
    if(!currentChapterId && project.chapters.length) currentChapterId = project.chapters[0].id;
    openChapter(currentChapterId);
    updateStats();
  }

  function renderChapterList(){
    chapterListEl.innerHTML = '';
    draftListEl.innerHTML = '';
    project.chapters.forEach(ch=>{
      const el = document.createElement('div');
      el.className = 'chapter-item' + (ch.id === currentChapterId ? ' active':'');
      el.tabIndex = 0;
      el.setAttribute('data-id', ch.id);
      el.innerHTML = `<span class="chapter-id-tag">${ch.id}</span><span title="${escapeHtml(ch.title)}">${escapeHtml(ch.title || '(无标题)')}</span><button class="del" aria-label="删除章节">✕</button>`;
      el.addEventListener('click', ()=>{ openChapter(ch.id); });
      el.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') openChapter(ch.id); if(e.key === 'Delete') deleteChapter(ch.id);} );
      el.querySelector('.del').addEventListener('click', (ev)=>{ ev.stopPropagation(); deleteChapter(ch.id); });
      if(ch.isDraft) draftListEl.appendChild(el); else chapterListEl.appendChild(el);
    });
  }

  function openChapter(id){
    saveCurrentChapterToModel();
    currentChapterId = id;
    const ch = project.chapters.find(c=>c.id===id);
    if(!ch) return;
    chapterIdInput.value = ch.id || '';
    chapterTitleInput.value = ch.title || '';
    chapterContentEl.value = ch.content || '';
    chapterWordsUpdate();
    // hide bubble editor by default
    bubbleEditorEl.classList.add('hidden');
    chapterContentEl.style.display = '';
    markDirty(false);
    renderChapterList();
  }

  function saveCurrentChapterToModel(){
    if(!currentChapterId) return;
    const ch = project.chapters.find(c=>c.id===currentChapterId);
    if(!ch) return;
    ch.id = chapterIdInput.value || ch.id;
    ch.title = chapterTitleInput.value || ch.title;
    ch.content = chapterContentEl.value;
    project.updatedAt = nowISO();
  }

  function addChapter(isDraft=false){
    const id = generateNextId();
    const newCh = { id, title: '新章节', content: '', isDraft };
    project.chapters.push(newCh);
    currentChapterId = id;
    renderProject();
    markDirty(true);
  }

  function generateNextId(){
    const nums = project.chapters.map(c=>{ const n=parseInt(c.id,10); return isNaN(n)?0:n; });
    const max = nums.length ? Math.max(...nums) : 0;
    return String((max+1)).padStart(3,'0');
  }

  function deleteChapter(id){
    if(!confirm('确认删除该章节？此操作不可撤销。')) return;
    const idx = project.chapters.findIndex(c=>c.id===id);
    if(idx>=0){ project.chapters.splice(idx,1); if(currentChapterId===id) currentChapterId = project.chapters[0] ? project.chapters[0].id : null; renderProject(); saveProject(); }
  }

  function chapterWordsUpdate(){
    const text = chapterContentEl.value || '';
    const words = text.length;
    document.getElementById('chapterWords').textContent = words + ' 字';
  }

  function updateStats(){
    // update simple stat card
    const num = project.chapters.filter(c=>!c.isDraft).length;
    const el = document.querySelector('#page-stats .stat-card .num');
    if(el) el.textContent = String(num);
  }

  // persistence
  function saveProject(){
    saveCurrentChapterToModel();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
      project.updatedAt = nowISO();
      markDirty(false);
      announce('保存完成');
    }catch(e){ console.error('保存失败', e); announce('保存失败'); }
  }

  function loadProject(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ project = JSON.parse(raw); }
      else project = defaultProject();
    }catch(e){ console.error('加载失败，使用新项目', e); project = defaultProject(); }
    renderProject();
  }

  function markDirty(v){ isDirty = !!v; if(isDirty){ saveStatusEl.textContent = '未保存'; saveStatusEl.classList.add('dirty'); } else { saveStatusEl.textContent = '已保存'; saveStatusEl.classList.remove('dirty'); } }

  function scheduleAutosave(){
    markDirty(true);
    if(autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(()=>{ saveProject(); autosaveTimer = null; }, AUTO_SAVE_DEBOUNCE);
  }

  // import/export
  function exportProject(){
    saveCurrentChapterToModel();
    const blob = new Blob([JSON.stringify(project, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (project.name || 'project') + '.ifproj';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    announce('已导出项目');
  }

  function exportTextAll(){
    saveCurrentChapterToModel();
    const txt = project.chapters.map(c=> `【${c.id}】 ${c.title}\n\n${c.content}` ).join('\n\n====\n\n');
    const blob = new Blob([txt], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = (project.name || 'project') + '.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    announce('已导出为纯文本');
  }

  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data && data.chapters){ if(confirm('导入将覆盖当前项目，是否继续？')){ project = data; currentChapterId = project.chapters[0] ? project.chapters[0].id : null; saveProject(); renderProject(); announce('导入完成'); } }
        else alert('无效的项目文件：未检测到章节数据');
      }catch(e){ alert('解析失败：文件不是有效的 JSON 或格式不符'); }
    };
    reader.readAsText(file);
  }

  // bubble compiler: very simple parser -> create elements in bubbleEditor
  function compileToBubble(text){
    // split by lines, detect 【角色名】"台词" and options and branches
    const lines = text.replace(/\r/g,'').split(/\n+/);
    const nodes = [];
    let i=0;
    while(i<lines.length){
      const line = lines[i].trim();
      if(!line){ i++; continue; }
      // option block
      if(line.startsWith('-选项开始')){
        const opt = { type: 'options', items: [] };
        i++;
        while(i<lines.length && !lines[i].trim().startsWith('-选项结束')){
          const l = lines[i].trim();
          if(l.startsWith('【') && l.includes('】')){
            const name = l.substring(1, l.indexOf('】'));
            opt.items.push({ title: name, content: '' });
            // following lines until next bracket or option end considered content
            i++;
            while(i<lines.length && !lines[i].trim().startsWith('【') && !lines[i].trim().startsWith('-选项结束')){
              opt.items[opt.items.length-1].content += lines[i] + '\n'; i++; }
            continue;
          }
          i++;
        }
        nodes.push(opt); i++; continue;
      }
      // dialogue: 【name】"text"
      if(line.startsWith('【') && line.includes('】')){
        const end = line.indexOf('】');
        const who = line.substring(1,end);
        const rest = line.substring(end+1).trim();
        const textMatch = rest.replace(/^\"|\"$/g,'');
        nodes.push({ type: 'dialogue', who, text: rest }); i++; continue;
      }
      // variable / if / endif / route markers
      if(line.startsWith('【if') || line.startsWith('【endif') || line.startsWith('*')){
        nodes.push({ type: 'meta', text: line }); i++; continue;
      }
      // default narrate
      nodes.push({ type: 'narrate', text: line }); i++;
    }
    return nodes;
  }

  function renderBubbleNodes(nodes){
    bubbleEditorEl.innerHTML = '';
    nodes.forEach(n=>{
      const el = document.createElement('div'); el.className = 'bubble-el';
      if(n.type === 'dialogue'){
        el.classList.add('bubble-dialogue');
        el.innerHTML = `<div class="bubble-tag">台词</div><div class="bubble-who" contenteditable="true">${escapeHtml(n.who)}</div><div class="bubble-content" contenteditable="true">${escapeHtml(n.text)}</div>`;
      } else if(n.type === 'narrate'){
        el.classList.add('bubble-narrate');
        el.innerHTML = `<div class="bubble-tag">旁白</div><div class="bubble-content" contenteditable="true">${escapeHtml(n.text)}</div>`;
      } else if(n.type === 'options'){
        el.classList.add('bubble-optionHead');
        el.innerHTML = `<div class="bubble-tag">选项</div><div class="bubble-content">${escapeHtml(n.items.map(it=>it.title).join(' | '))}</div>`;
        // add items
        n.items.forEach(it=>{
          const itEl = document.createElement('div'); itEl.className='bubble-el bubble-optionItem'; itEl.innerHTML = `<div class="bubble-tag">项</div><div class="bubble-content" contenteditable="true">${escapeHtml(it.title + '\n' + (it.content||''))}</div>`; bubbleEditorEl.appendChild(itEl);
        });
      } else {
        el.classList.add('bubble-fx'); el.innerHTML = `<div class="bubble-tag">指令</div><div class="bubble-content" contenteditable="true">${escapeHtml(n.text)}</div>`;
      }
      bubbleEditorEl.appendChild(el);
    });
  }

  function compileCurrentToBubble(){
    const text = chapterContentEl.value || '';
    const nodes = compileToBubble(text);
    renderBubbleNodes(nodes);
    // switch view
    document.querySelectorAll('.view-btn').forEach(b=> b.classList.remove('active'));
    const vb = document.querySelector('.view-btn[data-view="bubble"]'); if(vb){ vb.classList.add('active'); vb.setAttribute('aria-pressed','true'); }
    chapterContentEl.style.display = 'none'; bubbleEditorEl.classList.remove('hidden'); bubbleEditorEl.focus();
    announce('已生成气泡流');
  }

  function mergeBubbleToText(){
    // naive: iterate bubbleEditor children and reconstruct lines
    const parts = [];
    bubbleEditorEl.querySelectorAll('.bubble-el').forEach(el=>{
      if(el.classList.contains('bubble-dialogue')){
        const who = el.querySelector('.bubble-who')?.textContent.trim() || '';
        const text = el.querySelector('.bubble-content')?.textContent.trim() || '';
        parts.push(`【${who}】${text}`);
      } else if(el.classList.contains('bubble-narrate')){
        const text = el.querySelector('.bubble-content')?.textContent.trim() || '';
        parts.push(text);
      } else if(el.classList.contains('bubble-optionHead')){
        parts.push('-选项开始');
        // gather subsequent option items
        let sibling = el.nextElementSibling;
        while(sibling && sibling.classList.contains('bubble-optionItem')){
          const v = sibling.querySelector('.bubble-content')?.textContent || '';
          const lines = v.split('\n');
          const title = lines[0] || '';
          parts.push(`【${title}】`);
          if(lines.slice(1).join('\n').trim()) parts.push(lines.slice(1).join('\n'));
          sibling = sibling.nextElementSibling;
        }
        parts.push('-选项结束');
      } else {
        const text = el.querySelector('.bubble-content')?.textContent.trim() || '';
        parts.push(text);
      }
    });
    chapterContentEl.value = parts.join('\n\n');
    chapterContentEl.style.display = '';
    bubbleEditorEl.classList.add('hidden');
    chapterContentEl.focus();
    chapterWordsUpdate();
    scheduleAutosave();
    announce('已合并为文本');
  }

  // accessibility announce helper
  function announce(msg){
    saveStatusEl.textContent = msg;
    setTimeout(()=>{ if(!isDirty) saveStatusEl.textContent = '已保存'; }, 1500);
  }

  // helpers
  function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // events
  chapterContentEl && chapterContentEl.addEventListener('input', ()=>{ chapterWordsUpdate(); scheduleAutosave(); });
  chapterTitleInput && chapterTitleInput.addEventListener('input', ()=>{ scheduleAutosave(); renderChapterList(); });
  chapterIdInput && chapterIdInput.addEventListener('input', ()=>{ renderChapterList(); scheduleAutosave(); });

  btnAddChapter && btnAddChapter.addEventListener('click', ()=> addChapter(false));
  btnAddDraft && btnAddDraft.addEventListener('click', ()=> addChapter(true));

  btnSave && btnSave.addEventListener('click', ()=> { saveProject(); });

  // keyboard save (Ctrl+S)
  document.addEventListener('keydown',(e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveProject(); }
  });

  // import/export wiring
  btnExport && btnExport.addEventListener('click', ()=>{
    const opt = prompt('导出为：1) .ifproj (项目文件) 2) 文本 (.txt)\n输入 1 或 2','1');
    if(opt === '1') exportProject(); else if(opt === '2') exportTextAll();
  });

  btnImport && btnImport.addEventListener('click', ()=>{ importFileInput.click(); });
  importFileInput && importFileInput.addEventListener('change', (e)=>{ const f = e.target.files[0]; if(f) handleImportFile(f); importFileInput.value=''; });

  btnCompileBubble && btnCompileBubble.addEventListener('click', ()=> compileCurrentToBubble());
  btnMergeText && btnMergeText.addEventListener('click', ()=> mergeBubbleToText());

  // Save when switching chapters
  window.addEventListener('beforeunload', ()=>{ if(autosaveTimer) clearTimeout(autosaveTimer); saveProject(); });

  // load
  loadProject();

})();
</script>

</body>
</html>
