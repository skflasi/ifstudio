name: Deploy to GitHub Pages (alternative)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          # TODO: replace with your real build commands (example for npm sites):
          # npm ci
          # npm run build
          # Ensure the final static site is output to ./public
          echo "Building site..."
          mkdir -p public
          echo "Replace this with your built site" > public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
